<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion Inquiry Simulation</title>
<style>
  :root {
    --bg: #111827;
    --panel: #1f2937;
    --panel2: #263244;
    --text: #f8fafc;
    --muted: #cbd5e1;
    --accent: #f59e0b;
    --accent2: #38bdf8;
    --good: #22c55e;
    --canvas: #f8fafc;
    --ink: #0f172a;
    --line: #64748b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 10px;
    padding: 12px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .titleblock h1 {
    margin: 0;
    font-size: clamp(24px, 2.4vw, 38px);
    line-height: 1;
    letter-spacing: 0.01em;
  }

  .titleblock p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: clamp(14px, 1.2vw, 18px);
  }

  .scenario-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button, .speed-btn {
    border: 1px solid #475569;
    background: var(--panel);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s ease;
  }
  button:hover, .speed-btn:hover { background: #334155; }
  button.active, .speed-btn.active {
    background: var(--accent);
    color: #111827;
    border-color: var(--accent);
  }

  .stage-wrap {
    min-height: 0;
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 10px;
    display: flex;
  }

  .stage {
    position: relative;
    width: 100%;
    min-height: 0;
    background: var(--canvas);
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
  }

  .stage.split {
    grid-template-columns: 1.05fr 0.95fr;
    gap: 0;
  }

  .canvas-pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    border-right: 0;
  }
  .stage.split .canvas-pane:first-child {
    border-right: 3px solid #cbd5e1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .prompt-chip {
    position: absolute;
    top: 12px;
    left: 12px;
    transform: none;
    z-index: 3;
    background: rgba(15,23,42,0.90);
    color: white;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 700;
    white-space: normal;
    max-width: min(48vw, 520px);
    pointer-events: none;
  }

  .controls {
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: 12px;
  }

  .transport {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .transport button {
    min-width: 54px;
    padding: 10px 12px;
    font-size: 18px;
  }

  .speed-group {
    display: flex;
    gap: 6px;
  }
  .speed-btn { padding: 9px 12px; }

  .timeline-wrap {
    display: grid;
    grid-template-columns: 70px 1fr 70px;
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 9px;
    background: var(--panel2);
    border: 1px solid #475569;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { transform: scale(1.2); accent-color: var(--accent); }

  .fullscreen-btn { white-space: nowrap; }

  @media (max-width: 1150px) {
    .controls { grid-template-columns: 1fr; }
    .toggle-row { justify-content: flex-start; }
    .stage.split { grid-template-columns: 1fr 1fr; }
  }

  @media (max-height: 700px) {
    .app { padding: 8px; gap: 6px; }
    .controls { padding: 7px 9px; }
    button, .speed-btn { padding: 7px 10px; }
    .toggle { padding: 6px 8px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="titleblock">
      <h1>Motion Inquiry</h1>
      <p>Describe the motion as precisely as you can. What information would make your description better?</p>
    </div>
    <div class="scenario-tabs">
      <button class="scenario active" data-scenario="0">Scenario 1</button>
      <button class="scenario" data-scenario="1">Scenario 2</button>
      <button class="scenario" data-scenario="2">Scenario 3</button>
      <button class="fullscreen-btn" id="fullscreenBtn">Full Screen</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="canvas-pane"><canvas id="motionCanvas"></canvas></div>
      <div class="canvas-pane" id="graphPane" style="display:none;"><canvas id="graphCanvas"></canvas></div>
      <div class="prompt-chip" id="promptChip">Watch closely. Describe exactly what changes.</div>
    </div>
  </div>

  <div class="controls">
    <div class="transport">
      <button id="playBtn" title="Play / Pause">▶</button>
      <button id="backBtn" title="Step back">−0.5s</button>
      <button id="forwardBtn" title="Step forward">+0.5s</button>
      <button id="resetBtn" title="Reset">↺</button>
    </div>

    <div class="speed-group">
      <button class="speed-btn" data-speed="0.5">0.5×</button>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="2">2×</button>
    </div>

    <div class="timeline-wrap">
      <span id="timeNow">0.0 s</span>
      <input id="scrubber" type="range" min="0" max="1000" value="0" />
      <span id="timeMax">16.0 s</span>
    </div>

    <div class="toggle-row">
      <label class="toggle"><input type="checkbox" id="gridToggle"> Reference grid</label>
      <label class="toggle"><input type="checkbox" id="trailToggle"> Trail</label>
      <label class="toggle"><input type="checkbox" id="lineToggle"> Start-to-object line</label>
      <label class="toggle"><input type="checkbox" id="numbersToggle" checked> Measurements</label>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const motionCanvas = document.getElementById('motionCanvas');
  const graphCanvas = document.getElementById('graphCanvas');
  const mctx = motionCanvas.getContext('2d');
  const gctx = graphCanvas.getContext('2d');
  const stage = document.getElementById('stage');
  const graphPane = document.getElementById('graphPane');
  const playBtn = document.getElementById('playBtn');
  const scrubber = document.getElementById('scrubber');
  const timeNow = document.getElementById('timeNow');
  const timeMax = document.getElementById('timeMax');
  const promptChip = document.getElementById('promptChip');

  const state = {
    scenario: 0,
    time: 0,
    playing: false,
    rate: 1,
    lastFrame: performance.now(),
    showGrid: false,
    showTrail: false,
    showLine: false,
    showNumbers: true
  };

  const scenarioDefaults = [
    {showGrid:false, showTrail:false, showLine:false, showNumbers:true},
    {showGrid:false, showTrail:true,  showLine:true,  showNumbers:true},
    {showGrid:false, showTrail:false, showLine:false, showNumbers:false}
  ];

  const scenarioPrompts = [
    'Watch closely. Describe exactly how the motion changes.',
    'Describe the path as precisely as you can. Pay attention to every change in direction.',
    'Connect what you see on the left with what appears on the graph.'
  ];

  function smoothstep(x) { return x * x * (3 - 2 * x); }
  function lerp(a,b,u) { return a + (b-a)*u; }
  function clamp(v,a,b) { return Math.max(a, Math.min(b,v)); }

  function interpKeyframes(frames, t, eased=true) {
    if (t <= frames[0].t) return {...frames[0]};
    if (t >= frames[frames.length-1].t) return {...frames[frames.length-1]};
    for (let i=0;i<frames.length-1;i++) {
      const a=frames[i], b=frames[i+1];
      if (t >= a.t && t <= b.t) {
        const raw=(t-a.t)/(b.t-a.t || 1);
        const u=eased ? smoothstep(raw) : raw;
        return {t, x:lerp(a.x,b.x,u), y:lerp(a.y,b.y,u)};
      }
    }
    return {...frames[frames.length-1]};
  }

  function polylinePosition(points, duration, t) {
    const seg=[];
    let total=0;
    for (let i=0;i<points.length-1;i++) {
      const dx=points[i+1].x-points[i].x, dy=points[i+1].y-points[i].y;
      const len=Math.hypot(dx,dy);
      seg.push(len); total+=len;
    }
    const d=clamp(t/duration,0,1)*total;
    let acc=0;
    for (let i=0;i<seg.length;i++) {
      if (d <= acc+seg[i] || i===seg.length-1) {
        const u=seg[i]===0?0:(d-acc)/seg[i];
        return {x:lerp(points[i].x,points[i+1].x,u), y:lerp(points[i].y,points[i+1].y,u)};
      }
      acc+=seg[i];
    }
    return {...points[points.length-1]};
  }

  // Scenario 1: one-dimensional motion with visibly changing pace.
  // The insect starts from rest, speeds up east, cruises, slows to a stop,
  // pauses, then reverses and repeats the pattern at a different pace.
  function scenario1Position(t) {
    t=clamp(t,0,16);
    let x=0;
    if(t<=4){
      // 0 -> 6 m/s east (clear speeding up)
      x=0.75*t*t;
    } else if(t<=7){
      // steady east at 6 m/s
      x=12 + 6*(t-4);
    } else if(t<=10){
      // 6 -> 0 m/s east (clear slowing down)
      const u=t-7;
      x=30 + 6*u - u*u;
    } else if(t<=11){
      // stopped
      x=39;
    } else if(t<=13.5){
      // 0 -> 6 m/s west (speeds up after reversing)
      const u=t-11;
      x=39 - 1.2*u*u;
    } else if(t<=15){
      // steady west at 6 m/s
      x=31.5 - 6*(t-13.5);
    } else {
      // 6 -> 0 m/s west (slows to a stop)
      const u=t-15;
      x=22.5 - 6*u + 3*u*u;
    }
    return {x,y:0};
  }

  // Scenario 2: two-dimensional motion with deliberately obvious direction changes.
  const s2Frames = [
    {t:0,x:0,y:0},
    {t:3,x:42,y:0},      // east
    {t:6,x:42,y:28},     // north
    {t:9.5,x:-20,y:28},  // west
    {t:13,x:-20,y:-20},  // south
    {t:16,x:-34,y:-20}   // west again; ends southwest of start
  ];

  // Scenario 3: one-dimensional motion synchronized with a distance-from-start vs. time graph.
  function scenario3Position(t) {
    const frames=[
      {t:0,x:0,y:0},
      {t:3,x:10,y:0},
      {t:5,x:10,y:0},
      {t:7,x:42,y:0},
      {t:8,x:42,y:0},
      {t:11,x:22,y:0},
      {t:13.5,x:8,y:0},
      {t:16,x:8,y:0}
    ];
    return interpKeyframes(frames,t,false);
  }

  const scenarios = [
    {duration:16, bounds:{xmin:-8,xmax:50,ymin:-22,ymax:22}, pos:t=>scenario1Position(t)},
    {duration:16, bounds:{xmin:-50,xmax:58,ymin:-36,ymax:42}, pos:t=>interpKeyframes(s2Frames,t,false)},
    {duration:16, bounds:{xmin:-8,xmax:50,ymin:-22,ymax:22}, pos:t=>scenario3Position(t)}
  ];

  function currentScenario(){ return scenarios[state.scenario]; }

  function directionLabel(dx,dy) {
    if (Math.hypot(dx,dy) < 0.8) return 'at start';
    let deg=Math.atan2(dy,dx)*180/Math.PI; // world coordinates use +y = north
    if (deg<0) deg+=360;
    const dirs=['E','NE','N','NW','W','SW','S','SE'];
    return dirs[Math.round(deg/45)%8];
  }

  function pathDistance(scenarioIndex, t) {
    const sc=scenarios[scenarioIndex];
    const steps=Math.max(2,Math.ceil(260*t/sc.duration));
    let d=0;
    let prev=sc.pos(0);
    for(let i=1;i<=steps;i++){
      const ti=t*i/steps;
      const p=sc.pos(ti);
      d+=Math.hypot(p.x-prev.x,p.y-prev.y);
      prev=p;
    }
    return d;
  }

  function velocityDirection(sc,t){
    const dt=0.03;
    const a=sc.pos(clamp(t-dt,0,sc.duration));
    const b=sc.pos(clamp(t+dt,0,sc.duration));
    return Math.atan2(b.y-a.y,b.x-a.x);
  }

  function resizeCanvas(canvas){
    const rect=canvas.getBoundingClientRect();
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(10,Math.round(rect.width*dpr));
    const h=Math.max(10,Math.round(rect.height*dpr));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    const ctx=canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {w:rect.width,h:rect.height,dpr};
  }

  function makeTransform(bounds,w,h,pad=55){
    const sx=(w-2*pad)/(bounds.xmax-bounds.xmin);
    const sy=(h-2*pad)/(bounds.ymax-bounds.ymin);
    const s=Math.min(sx,sy);
    const cx=(bounds.xmin+bounds.xmax)/2;
    const cy=(bounds.ymin+bounds.ymax)/2;
    return {
      toCanvas(p){return {x:w/2+(p.x-cx)*s, y:h/2-(p.y-cy)*s};},
      scale:s
    };
  }

  function drawBackground(ctx,w,h,sc,tf){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,w,h);

    if(state.showGrid){
      ctx.save();
      ctx.strokeStyle='#dbe3ec'; ctx.lineWidth=1;
      const step=10;
      for(let x=Math.ceil(sc.bounds.xmin/step)*step;x<=sc.bounds.xmax;x+=step){
        const a=tf.toCanvas({x,y:sc.bounds.ymin}), b=tf.toCanvas({x,y:sc.bounds.ymax});
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
      for(let y=Math.ceil(sc.bounds.ymin/step)*step;y<=sc.bounds.ymax;y+=step){
        const a=tf.toCanvas({x:sc.bounds.xmin,y}), b=tf.toCanvas({x:sc.bounds.xmax,y});
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
      ctx.restore();
    }

    if(state.scenario===0 || state.scenario===2) drawTrack(ctx,tf);

    drawCardinals(ctx,w,h);
  }

  function drawCardinals(ctx,w,h){
    ctx.save();
    ctx.fillStyle='#0f172a';
    ctx.font='700 34px Arial';
    ctx.textAlign='center';
    ctx.fillText('N',w/2,40);
    ctx.fillText('S',w/2,h-20);
    ctx.fillText('W',36,h/2+11);
    ctx.fillText('E',w-36,h/2+11);
    ctx.restore();
  }

  function drawTrack(ctx,tf){
    const a=tf.toCanvas({x:0,y:0}), b=tf.toCanvas({x:55,y:0});
    ctx.save();
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.lineWidth=2;ctx.strokeStyle='#64748b';
    const tickValues = [0,10,20,30,40,50];
    for(const x of tickValues){
      const p=tf.toCanvas({x,y:0});
      ctx.beginPath();ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x,p.y+10);ctx.stroke();
      ctx.fillStyle='#334155';ctx.font='700 16px Arial';ctx.textAlign='center';
      let lab=x===0?'START':`${x} m E`;
      ctx.fillText(lab,p.x,p.y+30);
    }
    ctx.restore();
  }

  function drawTrail(ctx,sc,tf,t){
    if(!state.showTrail || t<=0) return;
    ctx.save();
    ctx.strokeStyle='#38bdf8'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    const steps=180;
    for(let i=0;i<=steps;i++){
      const ti=t*i/steps;
      const p=tf.toCanvas(sc.pos(ti));
      if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke(); ctx.restore();
  }

  function drawStart(ctx,tf,sc){
    const s=tf.toCanvas(sc.pos(0));
    ctx.save();
    ctx.fillStyle='#111827'; ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111827';ctx.font='700 16px Arial';ctx.textAlign='center';
    ctx.fillText('START',s.x,s.y+28);
    ctx.restore();
  }

  function drawStartLine(ctx,tf,sc,p){
    if(!state.showLine) return;
    const s=tf.toCanvas(sc.pos(0)), c=tf.toCanvas(p);
    ctx.save();
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;ctx.setLineDash([10,7]);
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(c.x,c.y);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }

  function drawBeetle(ctx,x,y,angle){
    ctx.save(); ctx.translate(x,y); ctx.rotate(-angle);
    ctx.strokeStyle='#111827';ctx.lineWidth=3;ctx.lineCap='round';
    // legs
    [[-8,-7,-18,-14],[-8,0,-20,0],[-8,7,-18,14],[8,-7,18,-14],[8,0,20,0],[8,7,18,14]].forEach(L=>{
      ctx.beginPath();ctx.moveTo(L[0],L[1]);ctx.lineTo(L[2],L[3]);ctx.stroke();
    });
    // antennae
    ctx.beginPath();ctx.moveTo(13,-5);ctx.lineTo(23,-11);ctx.moveTo(13,5);ctx.lineTo(23,11);ctx.stroke();
    // body
    ctx.fillStyle='#ef4444';ctx.beginPath();ctx.ellipse(0,0,16,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(13,0,7,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.stroke();
    // position dot
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }

  function roundedRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }

  function drawMeasurementBubble(ctx,canvasP,sc,p,t){
    if(!state.showNumbers) return;
    const start=sc.pos(0);
    const dx=p.x-start.x, dy=p.y-start.y;
    const straight=Math.hypot(dx,dy);
    const path=pathDistance(state.scenario,t);
    const dir=directionLabel(dx,dy);
    const label1=`Path traveled: ${path.toFixed(1)} m`;
    const label2=`Start → here: ${straight.toFixed(1)} m ${dir}`;
    const label3=`Time: ${t.toFixed(1)} s`;

    ctx.save();ctx.font='700 22px Arial';
    const lines=[label1,label2,label3];
    const widths=lines.map(s=>ctx.measureText(s).width);
    const boxW=Math.max(...widths)+34, boxH=92;
    let bx=canvasP.x+22, by=canvasP.y-82;
    const cw=motionCanvas.clientWidth, ch=motionCanvas.clientHeight;
    if(bx+boxW>cw-8) bx=canvasP.x-boxW-22;
    if(by<8) by=canvasP.y+22;
    if(by+boxH>ch-8) by=ch-boxH-8;
    roundedRect(ctx,bx,by,boxW,boxH,10);
    ctx.fillStyle='rgba(15,23,42,0.92)';ctx.fill();
    ctx.fillStyle='#ffffff';ctx.textAlign='left';
    lines.forEach((s,i)=>ctx.fillText(s,bx+16,by+28+i*26));
    ctx.restore();
  }

  function drawMotion(){
    const sc=currentScenario();
    const {w,h}=resizeCanvas(motionCanvas);
    const tf=makeTransform(sc.bounds,w,h,state.scenario===2?62:58);
    drawBackground(mctx,w,h,sc,tf);
    drawTrail(mctx,sc,tf,state.time);
    drawStart(mctx,tf,sc);
    const p=sc.pos(state.time);
    drawStartLine(mctx,tf,sc,p);
    const cp=tf.toCanvas(p);
    const angle=velocityDirection(sc,state.time);
    drawBeetle(mctx,cp.x,cp.y,angle);
    drawMeasurementBubble(mctx,cp,sc,p,state.time);

  }

  function drawGraph(){
    if(state.scenario!==2) return;
    const {w,h}=resizeCanvas(graphCanvas);
    gctx.clearRect(0,0,w,h);gctx.fillStyle='#ffffff';gctx.fillRect(0,0,w,h);

    const left=86,right=28,top=58,bottom=70;
    const xmin=0,xmax=currentScenario().duration;
    const ymin=0,ymax=45;
    const xpix=t=>left+(t-xmin)/(xmax-xmin)*(w-left-right);
    const ypix=y=>top+(ymax-y)/(ymax-ymin)*(h-top-bottom);

    // grid
    gctx.save();
    gctx.strokeStyle='#e2e8f0';gctx.lineWidth=1;
    for(let t=0;t<=16;t+=2){gctx.beginPath();gctx.moveTo(xpix(t),top);gctx.lineTo(xpix(t),h-bottom);gctx.stroke();}
    for(let y=0;y<=40;y+=5){gctx.beginPath();gctx.moveTo(left,ypix(y));gctx.lineTo(w-right,ypix(y));gctx.stroke();}
    // axes
    gctx.strokeStyle='#334155';gctx.lineWidth=2;
    gctx.beginPath();gctx.moveTo(left,top);gctx.lineTo(left,h-bottom);gctx.lineTo(w-right,h-bottom);gctx.stroke();

    // labels
    gctx.fillStyle='#0f172a';gctx.font='700 18px Arial';gctx.textAlign='center';
    gctx.fillText('Distance from Start vs. Time',w/2,30);
    gctx.font='600 15px Arial';
    for(let t=0;t<=16;t+=4) gctx.fillText(`${t}s`,xpix(t),h-bottom+28);
    gctx.textAlign='right';
    const yLabs=[[0,'0 m'],[10,'10 m'],[20,'20 m'],[30,'30 m'],[40,'40 m']];
    yLabs.forEach(([y,lab])=>gctx.fillText(lab,left-10,ypix(y)+5));

    // trace to current time only
    if(state.time>0){
      gctx.strokeStyle='#f59e0b';gctx.lineWidth=4;gctx.lineJoin='round';gctx.lineCap='round';
      gctx.beginPath();
      const steps=220;
      const n=Math.max(1,Math.floor(steps*state.time/xmax));
      for(let i=0;i<=n;i++){
        const t=state.time*i/n;
        const p=scenario3Position(t);
        const dist=Math.abs(p.x);
        if(i===0)gctx.moveTo(xpix(t),ypix(dist));else gctx.lineTo(xpix(t),ypix(dist));
      }
      gctx.stroke();
      const p=scenario3Position(state.time);
      const dist=Math.abs(p.x);
      gctx.fillStyle='#ef4444';gctx.beginPath();gctx.arc(xpix(state.time),ypix(dist),7,0,Math.PI*2);gctx.fill();
    }

    gctx.textAlign='center';gctx.fillStyle='#334155';gctx.font='700 16px Arial';
    gctx.fillText('Time',left+(w-left-right)/2,h-18);
    gctx.save();gctx.translate(24,top+(h-top-bottom)/2);gctx.rotate(-Math.PI/2);
    gctx.fillText('Distance from start',0,0);gctx.restore();
    gctx.restore();
  }

  function updateUI(){
    const sc=currentScenario();
    timeNow.textContent=`${state.time.toFixed(1)} s`;
    timeMax.textContent=`${sc.duration.toFixed(1)} s`;
    scrubber.value=Math.round(1000*state.time/sc.duration);
    playBtn.textContent=state.playing?'❚❚':'▶';
    promptChip.textContent=scenarioPrompts[state.scenario];
    graphPane.style.display=state.scenario===2?'block':'none';
    stage.classList.toggle('split',state.scenario===2);
  }

  function render(){
    drawMotion();
    if(state.scenario===2) drawGraph();
    updateUI();
  }

  function syncToggleUI(){
    document.getElementById('gridToggle').checked=state.showGrid;
    document.getElementById('trailToggle').checked=state.showTrail;
    document.getElementById('lineToggle').checked=state.showLine;
    document.getElementById('numbersToggle').checked=state.showNumbers;
  }

  function setScenario(i){
    state.scenario=i;state.time=0;state.playing=false;
    Object.assign(state,scenarioDefaults[i]);
    syncToggleUI();
    document.querySelectorAll('.scenario').forEach(b=>b.classList.toggle('active',Number(b.dataset.scenario)===i));
    render();
  }

  document.querySelectorAll('.scenario').forEach(btn=>btn.addEventListener('click',()=>setScenario(Number(btn.dataset.scenario))));
  playBtn.addEventListener('click',()=>{
    const sc=currentScenario();
    if(state.time>=sc.duration-0.01) state.time=0;
    state.playing=!state.playing;
    state.lastFrame=performance.now();
  });
  document.getElementById('resetBtn').addEventListener('click',()=>{state.time=0;state.playing=false;render();});
  document.getElementById('backBtn').addEventListener('click',()=>{state.time=clamp(state.time-0.5,0,currentScenario().duration);state.playing=false;render();});
  document.getElementById('forwardBtn').addEventListener('click',()=>{state.time=clamp(state.time+0.5,0,currentScenario().duration);state.playing=false;render();});
  document.querySelectorAll('.speed-btn').forEach(btn=>btn.addEventListener('click',()=>{
    state.rate=Number(btn.dataset.speed);
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b===btn));
  }));
  scrubber.addEventListener('input',()=>{
    state.time=currentScenario().duration*Number(scrubber.value)/1000;
    state.playing=false;render();
  });

  const toggles={
    gridToggle:'showGrid',trailToggle:'showTrail',lineToggle:'showLine',numbersToggle:'showNumbers'
  };
  Object.entries(toggles).forEach(([id,key])=>document.getElementById(id).addEventListener('change',e=>{state[key]=e.target.checked;render();}));

  document.getElementById('fullscreenBtn').addEventListener('click',async()=>{
    try {
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch(e) {}
  });

  window.addEventListener('resize',render);
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();playBtn.click();}
    if(e.code==='ArrowLeft'){e.preventDefault();document.getElementById('backBtn').click();}
    if(e.code==='ArrowRight'){e.preventDefault();document.getElementById('forwardBtn').click();}
    if(e.key==='r'||e.key==='R') document.getElementById('resetBtn').click();
    if(['1','2','3'].includes(e.key)) setScenario(Number(e.key)-1);
  });

  function tick(now){
    const dt=(now-state.lastFrame)/1000;state.lastFrame=now;
    if(state.playing){
      state.time+=dt*state.rate;
      const dur=currentScenario().duration;
      if(state.time>=dur){state.time=dur;state.playing=false;}
      render();
    }
    requestAnimationFrame(tick);
  }

  syncToggleUI();
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
